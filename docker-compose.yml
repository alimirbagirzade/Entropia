# =============================================================================
# Entropia V18 — local / first-production Docker Compose stack.
# Modular monolith: one backend image, many entrypoints (api + worker planes).
# Works identically on macOS, Windows (Docker Desktop) and Linux.
#   docker compose up -d --build
# =============================================================================

x-backend-build: &backend-build
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: entropia-backend:local
  # Defaults to .env (the normal local stack). An isolated E2E run overrides this
  # with ENTROPIA_ENV_FILE=.env.e2e.<flow> so its containers read a hermetic env
  # (own AUTH_MODE + service token) without ever touching the user's real .env.
  env_file: ${ENTROPIA_ENV_FILE:-.env}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  restart: unless-stopped
  # The image already drops root (`USER entropia`, uid 10001 — backend/Dockerfile).
  # These two close what that alone does not:
  #   no-new-privileges — a setuid binary inside the image can never raise the
  #     process back to root, so a code-execution bug in the API or a worker
  #     cannot escalate by finding one.
  #   cap_drop ALL      — the planes bind :8000 (unprivileged) and reach
  #     Postgres/Redis/S3 over TCP. None of them needs a single Linux capability,
  #     so the default set is pure attack surface.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Worker planes have no HTTP surface; dramatiq consumes from Redis. A live
# broker connection is the meaningful liveness signal — the container's PID 1
# IS the worker master, so a dead master already stops the container (caught by
# `restart:` + the acceptance state gate in scripts/acceptance.sh). This probe
# adds the "alive but cannot reach its broker" case on top of that.
x-worker-healthcheck: &worker-healthcheck
  healthcheck:
    test: ["CMD", "python", "-c", "import os,redis,sys; sys.exit(0 if redis.from_url(os.environ['REDIS_URL']).ping() else 1)"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s

# Runtime backend planes (api + every worker) need the schema migrated AND the
# baseline system identities/capabilities provisioned before they start. They
# depend on the `provision` one-shot, which itself depends on `migrate`, so the
# effective start order is postgres-healthy -> migrate -> provision -> plane.
# (`provision` transitively covers `migrate`; the redis/minio health gates are
# re-listed here because a service-level `depends_on` replaces the one inherited
# from *backend-build rather than merging with it.)
x-needs-provision: &needs-provision
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy
  provision:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-entropia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-entropia}
      POSTGRES_DB: ${POSTGRES_DB:-entropia}
    ports:
      # Host side is parameterized so an isolated E2E project can pick a
      # non-colliding port and coexist with the user's normal stack.
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-entropia} -d ${POSTGRES_DB:-entropia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-entropia}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-entropia-secret}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: ensure the artifact bucket exists, then exit.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${OBJECT_STORAGE_ACCESS_KEY:-entropia} ${OBJECT_STORAGE_SECRET_KEY:-entropia-secret} &&
      mc mb --ignore-existing local/${OBJECT_STORAGE_BUCKET:-entropia-artifacts} &&
      echo 'bucket ready';
      "
    restart: "no"

  # Runs Alembic migrations to head, then exits. Other services start after.
  migrate:
    <<: *backend-build
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # Mode-aware, idempotent baseline provisioning one-shot (audit PROV-06). Runs
  # AFTER migrations and BEFORE any plane that needs system identities. In
  # session mode (the .env default) it ensures the required Agent/system
  # principal + baseline capability rows WITHOUT creating the credentialless
  # human Admin (that would permanently block first-Admin bootstrap); in dev
  # mode it also provisions the dev Admin fixture (SEED_DEV_ADMIN follows
  # AUTH_MODE). It seeds NO demo/user-owned domain data — all such data stays
  # behind explicit SEED_* flags. Idempotent, so it re-runs harmlessly on every
  # `up`. Only Postgres is required (identities + capabilities are DB-only), so
  # its depends_on intentionally omits redis/minio.
  provision:
    <<: *backend-build
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "entropia.apps.seed"]
    restart: "no"

  api:
    <<: *backend-build
    command: ["uvicorn", "entropia.apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on: *needs-provision
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/v1/health/live').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker-default:
    <<: [*backend-build, *worker-healthcheck]
    depends_on: *needs-provision
    command: ["python", "-m", "entropia.apps.worker", "--queues", "default,maintenance"]

  worker-data:
    <<: [*backend-build, *worker-healthcheck]
    depends_on: *needs-provision
    command: ["python", "-m", "entropia.apps.worker", "--queues", "data"]

  worker-backtest:
    <<: [*backend-build, *worker-healthcheck]
    depends_on: *needs-provision
    command: ["python", "-m", "entropia.apps.worker", "--queues", "backtest"]

  worker-agent:
    <<: [*backend-build, *worker-healthcheck]
    depends_on: *needs-provision
    command: ["python", "-m", "entropia.apps.worker", "--queues", "agent,agent-high"]

  # The Coordinator dispatches every Agent task onto `agent-executor`
  # (apps/agent_coordinator/__main__.py -> send_job(run_agent_executor, ...)), and
  # the scheduler auto-redelivers that queue (ACTOR_BY_QUEUE). Without a consumer
  # the two combine into a silent infinite loop: tasks are enqueued, re-sent every
  # grace window, and never run — the send SUCCEEDS every time, so nothing reports
  # a fault. Its own service rather than a queue appended to worker-agent: the
  # executor runs the full backtest engine inside its body (run_agent_task's
  # stream_bars default is the same S3-backed streamer worker-backtest uses), so
  # it carries the backtest plane's runtime profile, not the tool gateway's
  # latency-sensitive one. Pinned by tests/unit/test_worker_plane_deployment.py.
  worker-agent-executor:
    <<: [*backend-build, *worker-healthcheck]
    depends_on: *needs-provision
    command: ["python", "-m", "entropia.apps.worker", "--queues", "agent-executor"]

  agent-coordinator:
    <<: [*backend-build, *worker-healthcheck]
    depends_on: *needs-provision
    command: ["python", "-m", "entropia.apps.agent_coordinator"]

  scheduler:
    <<: [*backend-build, *worker-healthcheck]
    depends_on: *needs-provision
    command: ["python", "-m", "entropia.apps.scheduler"]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    image: entropia-web:local
    ports:
      # Container side is 8080, not 80: the runtime image is nginx-unprivileged
      # and its master runs as uid 101, which cannot bind a privileged port. The
      # HOST side is unchanged, so localhost:8080 still serves the app.
      - "${WEB_HOST_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped
    # Serving static files needs no capabilities and no writable root. `/tmp` is
    # a tmpfs because nginx puts its client-body/proxy temp paths there, and a
    # read-only root without it would fail the first request large enough to spool.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # F-08 (audit 22-Jul): use the IPv4 loopback literal, not "localhost".
      # In this container "localhost" can resolve to ::1 (IPv6) while nginx
      # listens on 0.0.0.0:80 (IPv4), so the probe failed and the container was
      # marked unhealthy even though the served page worked. 127.0.0.1 is
      # deterministic and address-family-safe.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # Observability plane (ADIM 31) — the notification path, behind a profile.
  #
  # WHY A PROFILE. `profiles:` means neither service starts on a plain
  # `docker compose up`, so scripts/acceptance.sh, scripts/e2e-acceptance.sh and
  # scripts/a11y-audit-stack.sh bring up exactly the stack they brought up
  # before this slice. Start them deliberately:
  #
  #   docker compose --profile observability up -d prometheus alertmanager
  #
  # WHY THEY ARE HERE AND NOT IN A SEPARATE FILE. Until ADIM 31 the repo shipped
  # alert RULES with no way to run them, and the release readiness report
  # (docs/releases/Entropia_V18_RC_Readiness_2026-08-07.md §6.3) counted eleven
  # validated rules — seven of them paging — that reached nobody. A notification
  # path that lives in a file the deployment does not use would have reproduced
  # exactly that. These are the services an operator actually runs.
  #
  # NEITHER SERVICE HAS depends_on. That is deliberate: the pair must be able to
  # come up while the API is down, because "the API is down" is the first thing
  # they exist to report. It is also what lets
  # scripts/alert-notification-proof.sh fire EntropiaApiDown for real — with no
  # `api` service running, `up{job="entropia-api"} == 0` is true on the SHIPPED
  # scrape config and the SHIPPED rule, with no synthetic fixture anywhere.
  # ===========================================================================
  prometheus:
    # Pinned BY DIGEST, not by tag — the same supply-chain idiom as the promtool
    # pin in scripts/alert-rules-gate.sh and the gitleaks/trivy pins in
    # .github/workflows/security.yml. Prometheus v3.5.0 (LTS); bump the digest
    # and that script's constant together, deliberately.
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: ["observability"]
    # ops/prometheus/entrypoint.sh refuses to exec Prometheus without
    # ENTROPIA_METRICS_TOKEN: GET /metrics is fail-closed in production, so an
    # unauthenticated scraper reads a healthy API as `up == 0` and pages forever.
    entrypoint: ["/bin/sh", "/ops/prometheus/entrypoint.sh"]
    environment:
      ENTROPIA_METRICS_TOKEN: ${ENTROPIA_METRICS_TOKEN:-}
    volumes:
      # The WHOLE ops/ tree, read-only. `rule_files` in prometheus.yml is the
      # relative path ../alerts/entropia.rules.yml, so mounting only the
      # prometheus/ directory would load a config that resolves its rules to
      # nothing — and load it successfully.
      - ./ops:/ops:ro
      - prometheusdata:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  alertmanager:
    image: prom/alertmanager@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    profiles: ["observability"]
    # THE FAIL-CLOSED SEAM. There is no default destination here and there is no
    # `${ALERTMANAGER_NOTIFY_URL:?...}` either: a required-variable marker would
    # abort compose file interpolation for the WHOLE stack, breaking every
    # `docker compose up` in the repo even though this service is profiled off.
    # The refusal belongs in the container instead — ops/alertmanager/entrypoint.sh
    # exits 78 when ALERTMANAGER_NOTIFY_URL is unset, empty, or not an http(s)
    # URL, so an Alertmanager either has a real destination or has no process.
    entrypoint: ["/bin/sh", "/ops/alertmanager/entrypoint.sh"]
    environment:
      ALERTMANAGER_NOTIFY_URL: ${ALERTMANAGER_NOTIFY_URL:-}
      ALERTMANAGER_NOTIFY_URL_TICKET: ${ALERTMANAGER_NOTIFY_URL_TICKET:-}
    volumes:
      - ./ops:/ops:ro
      - alertmanagerdata:/alertmanager
    ports:
      # Published so an operator can create a silence: several rules'
      # `false_positives` annotations explicitly ask for one around a planned
      # deploy or a debugging session. See docs/runbooks/alert-notification.md §4.
      - "${ALERTMANAGER_HOST_PORT:-9093}:9093"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
  redisdata:
  miniodata:
  # Alertmanager's notification log and silences must survive a restart: without
  # it, a restart re-notifies every firing alert and forgets every silence an
  # operator set. Prometheus's TSDB is here for the same reason at a lower
  # stake — a fresh volume just loses history.
  prometheusdata:
  alertmanagerdata:
