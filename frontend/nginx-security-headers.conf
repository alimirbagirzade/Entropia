# Security response headers, in an include rather than inline, because nginx's
# `add_header` inheritance is a trap: a directive at an outer level applies to a
# nested `location` ONLY IF that location declares no `add_header` of its own.
#
# That is not hypothetical here. `location /assets/` sets `add_header
# Cache-Control "public, immutable"`, which silently cancelled all three
# server-level security headers — so every hashed JS and CSS bundle, i.e. all the
# executable code this app ships, was served with no `nosniff`, no
# `X-Frame-Options` and no `Referrer-Policy`, while `/` looked correct.
#
# Keeping them in one file that BOTH levels include makes the rule structural: a
# new location block that sets a header adds one `include` line and cannot
# regress the set.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# No feature on this origin needs camera, microphone or geolocation, and the SPA
# never uses them. Denying by default means a future dependency cannot quietly
# start asking.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Content-Security-Policy. The API has had one since Stage 8b
# (`apps/api/hardening.py`, pinned by a live-response assertion in
# `tests/contract/test_hardening_contract.py`); this origin — the one that
# serves the executable bundle — had none.
#
# The policy is as narrow as the SHIPPED V18 build actually is, measured from
# `dist/`, not assumed:
#   * `default-src 'none'` — deny first, then open only what the build needs.
#   * `script-src 'self'` — the build emits ONE external module script and no
#     inline `<script>`; `eval` and `new Function` appear nowhere in the bundle.
#     Neither 'unsafe-inline' nor 'unsafe-eval' is present because neither is
#     needed. The ~800 React `style={{…}}` props are applied through CSSOM
#     (`node.style.setProperty`), which style-src does not police, so they do
#     not force 'unsafe-inline' either.
#   * `style-src 'self'` — the build emits ONE external stylesheet and no
#     inline `<style>`; the theme is CSS custom properties inside that file.
#   * `img-src 'self'` — favicon.svg only. The built CSS carries no `url()` and
#     the build inlined no `data:` assets.
#   * `connect-src 'self' __API_ORIGIN__` — fetch and the SSE stream reach the
#     API. See the substitution note below.
#   * `base-uri 'none'` — the app never uses `<base>`; an injected one would
#     re-point every relative asset URL.
#   * `form-action 'self'` — every `<form>` here is `onSubmit` + preventDefault
#     and none declares an `action`, so nothing legitimate posts off-origin.
#     'self' rather than 'none' deliberately: 'none' would also block a native
#     submit that slipped past a handler bug, turning a visible bug into an
#     invisible one, while 'self' still closes the off-origin exfiltration path.
#   * `frame-ancestors 'none'` — the modern statement of the X-Frame-Options
#     line above; both ship, because different browsers read different ones.
#   * `object-src 'none'` — restated rather than left to `default-src`, that
#     fallback being the one browsers have historically got wrong.
#
# __API_ORIGIN__ is substituted at IMAGE BUILD TIME from the same
# VITE_API_BASE_URL build arg that Vite inlines into the bundle (see
# Dockerfile), and the build FAILS if the placeholder survives. Two reasons it
# is not a runtime lookup: the bundle can only ever talk to the origin Vite
# baked in, so a runtime value could only ever disagree with it; and the web
# container runs `read_only: true` (docker-compose.yml), so nginx's envsubst
# entrypoint could not write a generated config there anyway. A relative base
# URL is same-origin, substitutes to nothing, and leaves `connect-src 'self'`.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' __API_ORIGIN__; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
