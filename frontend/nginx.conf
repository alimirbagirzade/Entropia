server {
    # 8080, not 80: the runtime image is nginx-unprivileged, whose master runs as
    # uid 101 and therefore cannot bind a privileged port. The HOST port is
    # unchanged (`${WEB_HOST_PORT:-8080}` in docker-compose.yml), so every caller
    # — e2e, install-acceptance, scripts/smoke.sh — still reaches localhost:8080.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Load-bearing, not redundant: this block's own `add_header` above stops
        # the server-level headers from being inherited. See the include file.
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback: every unknown path serves index.html (client router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
