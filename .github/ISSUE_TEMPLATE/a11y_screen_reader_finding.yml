name: A11Y — screen-reader finding (A-08)
description: A defect heard during the human NVDA/VoiceOver acceptance audit (#514)
title: "[SR-BULGU] "
labels: ["accessibility", "a11y-screen-reader"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template **only** for something a person heard (or failed to hear)
        while driving the product with a real screen reader.

        An axe-core violation is not a screen-reader finding — file those as a normal
        bug. The distinction matters: axe checks the DOM, this checks whether the user
        can complete the task from what they hear.

        Every field below maps one-to-one onto a column of the findings register in
        `docs/audit/a11y_screen_reader_audit_results.md`, so the issue and the
        worksheet never drift.

  - type: input
    id: finding_id
    attributes:
      label: Finding ID
      description: The `SR-BULGU-nn` you allocated in the worksheet's findings register.
      placeholder: SR-BULGU-01
    validations:
      required: true

  - type: input
    id: auditor
    attributes:
      label: Auditor
      description: The person who heard it. Not a tool name.
    validations:
      required: true

  - type: input
    id: audit_date
    attributes:
      label: Date (ISO 8601)
      placeholder: "2026-08-06"
    validations:
      required: true

  - type: dropdown
    id: combination
    attributes:
      label: Combination
      description: A-08 requires both; a finding belongs to the one that surfaced it.
      options:
        - SR-1 — NVDA / Firefox / Windows
        - SR-2 — VoiceOver / Safari / macOS
        - Both combinations (reproduced on each)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS + screen reader + browser, with versions
      description: Announcement behaviour is version-specific — an unversioned finding cannot be retested.
      placeholder: "Windows 11 23H2 · NVDA 2026.1 · Firefox 141.0"
    validations:
      required: true

  - type: input
    id: stack_commit
    attributes:
      label: Stack commit
      description: "`git rev-parse HEAD` of the audit stack (scripts/a11y-audit-stack.sh)."
    validations:
      required: true

  - type: input
    id: route
    attributes:
      label: Route
      description: The path from Section A of the worksheet.
      placeholder: /backtest/ready-check
    validations:
      required: true

  - type: input
    id: check_ref
    attributes:
      label: Checklist reference
      description: "`A-1`…`A-8` or `B-1`…`B-10`, or `—` if it belongs to neither."
      placeholder: B-3
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keystrokes, not mouse actions. Include the screen-reader mode (browse/focus, or VO cursor).
      placeholder: |
        1. Sign in as e2e_admin, navigate to /backtest/ready-check
        2. NVDA in browse mode, press `B` to reach "Run Ready Check"
        3. Press Enter, wait for the result
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected — what should have been announced
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed — what was actually announced
      description: Verbatim where possible, including silence ("nothing was announced").
    validations:
      required: true

  - type: input
    id: wcag
    attributes:
      label: WCAG success criterion
      placeholder: 4.1.3 Status Messages (AA)
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - blocker — the task cannot be completed with a screen reader
        - major — the task can be completed, but badly or by guessing
        - minor — annoyance, task unaffected
    validations:
      required: true

  - type: dropdown
    id: disposition
    attributes:
      label: Proposed disposition
      description: |
        `PO-APPROVE` is a signed permanent deviation recorded in
        `docs/implementation/v18_visual_deviations.md` (like D-10) — a product-owner
        decision, not a way to clear a row. There is no third value.
      options:
        - FIX — must be repaired
        - PO-APPROVE — proposed as a signed deviation (needs the PO)
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Audio/screen recording path, transcript excerpt, or speech-viewer log.
    validations:
      required: true

  - type: checkboxes
    id: retest
    attributes:
      label: Retest checklist (tick as the fix is verified — not when it is written)
      description: Mirrors §4 of `docs/audit/a11y_screen_reader_audit_results.md`.
      options:
        - label: The FIX is merged to `main` and the audit stack was rebuilt from that commit
        - label: Fixture validation passes on the rebuilt stack
        - label: Reproduced on the SAME combination that found it — the expected announcement is now heard
        - label: The OTHER combination was re-checked on this route
        - label: The route's full Section A row was re-run with no new failure
        - label: Every Section B flow touching this route was re-run
        - label: The worksheet's `Retest` column reads `PASS <date> <auditor>`
        - label: "`npm run a11y` is still green on the fix commit"

  - type: checkboxes
    id: human_attestation
    attributes:
      label: Attestation
      options:
        - label: I heard this with a real screen reader. It was not inferred from the DOM, from axe-core output, or from a Playwright report.
          required: true

  - type: markdown
    attributes:
      value: |
        ---
        Parent: **#514** — A-08 stays `HUMAN-BLOCKED` until every exit criterion in
        `docs/audit/a11y_screen_reader_audit_results.md` §5 is met. Closing #514 is a
        human decision; an agent must not close it.
