[project]
name = "entropia"
version = "0.1.0"
description = "Entropia V18 — quantitative trading strategy & backtest platform (backend)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }

dependencies = [
  # --- HTTP application layer ---
  "fastapi>=0.141.1,<1.0",
  "uvicorn[standard]>=0.52.1,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.15.0,<3.0",
  "sse-starlette>=3.4.8,<4.0",
  "python-multipart>=0.0.12",
  # --- Persistence (PostgreSQL 16) ---
  "sqlalchemy[asyncio]>=2.0.51,<3.0",
  "asyncpg>=0.31.0,<0.32",
  "alembic>=1.19.1,<2.0",
  "greenlet>=3.5.4",
  # --- Queue / workers (Redis 7 + Dramatiq) ---
  "redis>=8.1.0,<9.0",
  "dramatiq[redis]>=2.2.0,<3.0",
  # --- Object storage (S3 / MinIO) ---
  "boto3>=1.43.67,<2.0",
  # --- Columnar data toolchain ---
  "polars>=1.43.2,<2.0",
  "pyarrow>=25.0.1",
  # --- Observability ---
  "structlog>=24.4",
  # --- Authentication (M1 / Master §20: local auth, argon2id password hashes) ---
  "argon2-cffi>=23.1,<26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10.0",
  "pytest-asyncio>=1.4.0,<2.0",
  "pytest-cov>=5.0",
  "httpx>=0.27,<1.0",
  "boto3-stubs[s3]>=1.43.67",
  "openapi-spec-validator>=0.7,<1.0",
  # Reads ops/alerts/entropia.rules.yml in test_alert_rules_contract.py. Declared
  # rather than inherited: uvicorn[standard] happens to pull PyYAML in today, and
  # a test that silently depends on someone else's extra breaks the day that
  # extra is trimmed.
  "pyyaml>=6.0,<7.0",
  # ruff 0.15.21's Linux x86_64 wheel ships no `ruff` binary, so `uv run ruff`
  # fails with "Failed to spawn: ruff" in CI (the macOS wheel is fine, which is
  # why it passed locally). Pin to the last good release until a fixed one lands.
  "ruff>=0.16.2,<0.16.3",
  "mypy>=1.11,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entropia"]

# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["B008", "UP046", "UP047"]  # FastAPI Depends defaults; keep Generic[T] for Pydantic v2.

[tool.ruff.lint.isort]
known-first-party = ["entropia"]

# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["dramatiq.*", "boto3.*", "botocore.*", "pyarrow.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
[tool.coverage.run]
# The three process entry points are exec'd as separate OS processes (dramatiq
# worker, scheduler, agent coordinator); the suite drives their actor and command
# functions directly, so the `python -m` bootstrap lines are dead weight in the
# measurement rather than untested behaviour.
omit = ["*/__main__.py"]

[tool.coverage.report]
# Same omit at report time so a bare `coverage report` / `coverage html` outside
# pytest shows the same number the gate below enforces.
omit = ["*/__main__.py"]
precision = 1
exclude_lines = [
  "pragma: no cover",
  # Blocks and signatures that exist only for the type checker.
  "if TYPE_CHECKING:",
  "@overload",
  "@(abc\\.)?abstractmethod",
  # A bare ellipsis body is a declaration (Protocol / stub), not behaviour.
  "^\\s*\\.\\.\\.$",
  # Abstract seams and module bootstraps: covering these would test the seam
  # rather than the product.
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# --cov-fail-under turns the coverage number into a gate. Before this, CI ran
# WITH coverage but nothing ever failed on it, so coverage could decay silently.
#
# 90 is CALIBRATED against a measurement, not picked as a round number: a full
# green run (2712 passed, 0 failed) measures 92.06% — docs/audit/coverage_baseline.md
# records the run and the per-module breakdown. The gate first shipped at 80 with
# no measurement behind it, which left twelve points of slack; the whole
# application/commands layer could lose its tests and CI would still pass. The
# two points between 90 and the measured 92.06 are headroom for the macOS-local
# vs CI-Linux difference, which has not been measured separately yet — tighten
# toward 91 once CI has reported its own number.
#
# A local run that deliberately measures a subset should pass --no-cov (as the
# verify snippet in backend/README.md does) instead of lowering this number, and
# a red run is fixed by adding the missing test, never by dropping the floor.
addopts = "-q --cov=entropia --cov-report=term-missing --cov-fail-under=90"
markers = [
  "integration: requires postgres/redis/minio",
  "contract: API request/response/SSE schema tests",
  "deterministic: pinned-manifest backtest replay tests",
  "acceptance: end-to-end workflow tests",
]
