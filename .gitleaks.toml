# Secret-scan configuration. Extends gitleaks' default ruleset — the rules
# themselves are NOT weakened; only the six verified false positives below are
# allowed, each by a narrow regex tied to the domain term that triggered it.
#
# Why an allowlist is needed at all: gitleaks' `generic-api-key` rule is
# keyword+entropy based, and this codebase's DOMAIN VOCABULARY is built on the
# words it keys off. `Idempotency-Key` is a first-class HTTP contract here
# (CLAUDE.md §O-13), `execution_key` names a backtest execution, "OCC token" is
# the concurrency contract, and `app_metadata` rows are addressed by `key=`.
# Every hit below is one of those, not a credential.
#
# Deliberately NOT done: excluding paths (`backend/tests/**`, `scripts/**`).
# A path exclusion would also stop the scanner finding a REAL key committed into
# a test fixture — the most likely place for one to land. These allowlists match
# the identifier shape, so an actual secret on any of those lines still fires.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key (default rule, re-declared to carry an allowlist)"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]
entropy = 3.5
secretGroup = 1

  [rules.allowlist]
  regexTarget = "line"
  regexes = [
    # Domain identifiers, not credentials. `idempotency_key=` is the
    # Idempotency-Key contract value; `execution_key=` names a backtest
    # execution. Both appear as literal fixtures throughout backend/tests.
    '''(idempotency_key|execution_key)\s*=\s*["'][^"']+["']''',
    # `select ... from app_metadata where key='<row name>'` — a table row key,
    # asserted by the install/upgrade acceptance scripts.
    '''app_metadata\s+where\s+key\s*=''',
    # Prose in comments that names the contracts by their real names, e.g.
    # "query keys, OCC/Idempotency tokens, hooks and the lib data logic".
    '''^\s*(//|#|\*)\s.*\b(OCC|Idempotency|query keys)\b''',
    # A whole-line JSON entry whose value is exactly 64 lowercase hex characters:
    # the shape of `engine_golden_digests.json`, where every value is a SHA-256 of
    # an `EngineOutput` and every key is a scenario name. Two of them tripped the
    # entropy threshold once the #550/#551/#552 fixes changed what the engine emits
    # — `contract.execution_key` on the keyword "key", and
    # `sizing.base_percent_of_capital` on the "api" inside "cAPItal". Which digests
    # trip it is luck: the values are content hashes, so every regeneration reshuffles
    # them, and pinning the fingerprints would fail again on the next legitimate bump.
    #
    # Shape, not path, deliberately — consistent with the note above. Excluding
    # `backend/tests/**` (or even this one file) would stop the scanner finding a real
    # key pasted into a fixture. This anchors on `^…$` so it only forgives a line that
    # is ENTIRELY one entry, and the key must be DOTTED (`sizing.base_percent_of_capital`)
    # — measured: without that the pattern also forgave a bare `"token": "<64 hex>"`,
    # which is exactly the shape a leaked credential takes. A keyword exclusion cannot be
    # used here, because the two real hits are keyed on "key" and on the "api" inside
    # "capital". Residual gap, stated rather than hidden: a credential written as
    # `"a.dotted.name": "<64 lowercase hex>"` alone on its line.
    #
    # (RE2 — no lookaround available, so the narrowing is done with the dot.)
    '''^\s*"[a-z0-9_]+(\.[a-z0-9_]+)+"\s*:\s*"[0-9a-f]{64}",?\s*$''',
  ]

# `.env.example` is the committed TEMPLATE, and its values are the documented
# local-only defaults (POSTGRES_PASSWORD=entropia, OBJECT_STORAGE_SECRET_KEY=
# entropia-secret). They are meant to be public and are meant to be overridden.
# The backend now REFUSES to start in production while they are still in place
# (config/settings.py::_reject_shipped_default_credentials_in_production), so
# their being readable here is a documented boundary, not a leak.
[allowlist]
description = "Committed template of local-only defaults"
paths = ['''^\.env\.example$''']
