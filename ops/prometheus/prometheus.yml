# Entropia — Prometheus scrape and alerting configuration (ADIM 26, ADIM 31).
#
# WHY THIS FILE EXISTS AT ALL. ops/alerts/entropia.rules.yml shipped in ADIM 25
# with four rules keyed on `job="entropia-api"`. That name was asserted by a
# COMMENT and enforced by nothing: rename the scrape job in a deployment and
# EntropiaApiDown, EntropiaMetricsDatabaseProbeFailing and both worker-absence
# rules stop matching anything, while still parsing and still loading. This file
# makes the name a checked fact — `promtool check config` loads it together with
# the rules (scripts/alert-rules-gate.sh), and
# test_alert_rules_contract.py::test_every_job_matcher_names_a_declared_scrape_job
# fails the build if a rule ever names a job this config does not declare.
#
# WHAT CHANGED IN ADIM 31. Between ADIM 26 and ADIM 31 this file carried, in this
# spot, a paragraph explaining that it deliberately had NO `alerting:` block
# because the repo shipped no Alertmanager — so `severity: page` and
# `severity: ticket` were labels with no configured receiver and nothing here
# paged anyone. That gap was recorded as a release blocker
# (docs/releases/Entropia_V18_RC_Readiness_2026-08-07.md §6.3: eleven validated
# rules, seven of them paging, none of them reaching a human) and ADIM 31 closed
# it. The `alerting:` block below is that closure. Everything above it — the
# scrape job name, the relative paths, the credential — is unchanged.
#
# HOW AN OPERATOR USES IT. Two ways, and they are the same config:
#   * `docker compose --profile observability up -d prometheus alertmanager`
#     runs the shipped pair. The Prometheus service mounts this whole `ops/` tree
#     and ops/prometheus/entrypoint.sh stages a VERBATIM copy of it — which is
#     what lets scripts/alert-notification-proof.sh read the loaded config back
#     out of GET /api/v1/status/config and diff it against this file.
#   * Or mount `ops/` into a Prometheus you run yourself and point it here. Both
#     `rule_files` and `credentials_file` below are RELATIVE, and Prometheus
#     resolves relative paths against the config file's own directory, so the
#     tree relocates as one unit.
# See docs/runbooks/alert-notification.md for the delivery path end to end.

global:
  # Matches SCHEDULER_TICK_SECONDS (config/settings.py). Every threshold in the
  # rules file is expressed as a multiple of that tick, so scraping slower than
  # the tick would blur the very signal the derivations are counted in.
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    deployment: entropia

rule_files:
  - ../alerts/entropia.rules.yml

# THE HALF THAT WAS MISSING UNTIL ADIM 31. Rule evaluation without this block
# ends at "the alert is firing" — a state visible only to whoever is already
# looking at Prometheus's own UI. This is what carries a fired alert out of the
# evaluator and into ops/alertmanager/alertmanager.yml, which routes it by
# `severity` to a destination that ops/alertmanager/entrypoint.sh refuses to
# fabricate.
alerting:
  alertmanagers:
    # The compose service name and container port (docker-compose.yml
    # `alertmanager`, profile `observability`). A static target and not service
    # discovery: one Alertmanager, resolved by the compose network's DNS.
    #
    # NOTE ON THE FAILURE MODE THIS DOES NOT COVER. If Alertmanager is
    # unreachable, Prometheus retries and increments
    # `prometheus_notifications_errors_total` — on its OWN /metrics, which
    # nothing in this deployment scrapes. A notification path cannot alert on its
    # own absence from inside itself; that is a monitoring-the-monitor problem
    # and it stays open, recorded in docs/runbooks/alert-notification.md §5
    # rather than papered over here.
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The job name four alert rules match on. Changing it here without changing
  # them there is what the contract test exists to stop.
  - job_name: entropia-api
    metrics_path: /metrics
    scheme: http
    # GET /metrics is credentialed (finding O-22) and fail-closed in production,
    # so an unauthenticated scraper gets 403 and the target reads as `up == 0`
    # while the product is perfectly healthy — the false-positive EntropiaApiDown
    # warns about. The file holds ENTROPIA_METRICS_TOKEN verbatim; it is
    # gitignored, never committed, and the validation gate substitutes a
    # throwaway placeholder so the config's SHAPE can be checked without one.
    authorization:
      type: Bearer
      credentials_file: metrics_token
    static_configs:
      # The compose service name and container port (docker-compose.yml `api`).
      # Only the API process serves /metrics — worker, scheduler and
      # agent-coordinator have no HTTP surface, which is why their health is
      # inferred from the gauges rather than from `up`.
      - targets: ["api:8000"]
