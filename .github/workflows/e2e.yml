name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only token — see the same block in ci.yml. This workflow matters more than
# most: it boots the full Compose stack and drives it with a real browser, so it
# executes Playwright, its browser downloads and the whole application inside the
# job. None of that should be holding a token that can write to the repository.
permissions:
  contents: read

jobs:
  e2e:
    name: E2E — real browser vs. Docker Compose stack (F-23)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the .env for the Compose stack
        run: |
          cp .env.example .env
          # .env.example already ships the NORMAL LOCAL profile (AUTH_MODE=session),
          # so the E2E runs that profile verbatim — no ad-hoc auth-mode surgery that
          # would only prove a repaired test env instead of the user's installation
          # path (audit TEST-06). We supply ONLY test-only values, none of which
          # correct a wrong product default:
          #   * a deterministic first Admin for the real-login / Trash journeys;
          #   * a strong, non-committed service token so the session profile's
          #     non-human service line (agent/scheduler/coordinator/workers) is
          #     enabled — the real session profile, not a degraded one (audit §9.4).
          sed -i \
            -e 's/^ENTROPIA_BOOTSTRAP_ADMIN_EMAIL=.*/ENTROPIA_BOOTSTRAP_ADMIN_EMAIL=e2e_admin@e2e.entropia.test/' \
            -e "s#^ENTROPIA_SERVICE_TOKEN=.*#ENTROPIA_SERVICE_TOKEN=e2e-only-$(openssl rand -hex 24)#" \
            .env

      - name: Start the Docker Compose stack
        run: |
          # A registry/BuildKit transport blip — "target web: failed to solve:
          # Unavailable: error reading from server: EOF" while resolving a base
          # image — used to kill the whole job in ~30s, before a single test ran.
          # The pull+build is therefore retried a bounded number of times, with a
          # clean slate between attempts.
          #
          # This does NOT mask a real failure: a broken Dockerfile, a bad compose
          # file, or an image that genuinely cannot be built fails all three
          # attempts identically and the step still exits non-zero. Only the
          # transient transport class survives the retry.
          for attempt in 1 2 3; do
            if docker compose up -d --build; then
              exit 0
            fi
            echo "::warning::docker compose up failed (attempt ${attempt}/3); retrying"
            docker compose down --remove-orphans --volumes || true
            sleep $((attempt * 10))
          done
          echo "::error::docker compose up failed after 3 attempts"
          exit 1

      - name: Wait for the API and web app to become ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health/ready >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080 >/dev/null 2>&1; then
              echo "Stack is ready."
              exit 0
            fi
            echo "Waiting for stack... ($i/60)"
            sleep 5
          done
          echo "Stack did not become ready in time." >&2
          docker compose ps
          docker compose logs --tail 200
          exit 1

      - name: Seed the E2E golden fixture (R2-07) + live ESP registry (R2-12)
        # Idempotent: approved market dataset + processed Parquet bars,
        # approved+published ta.sma indicator package, canonical rationale
        # families. Deliberately skips the default-Admin identity seed so the
        # ENTROPIA_BOOTSTRAP_ADMIN_EMAIL first-signup promotion stays intact.
        # R2-12: SEED_ESP_TA seeds the live trusted-active resolver registry
        # (spec 04's Pre-Check) via the bare admin PRINCIPAL only — no
        # HumanUser row, so the first-Admin bootstrap window stays open.
        run: docker compose exec -T -e SEED_E2E_GOLDEN=1 -e SEED_ESP_TA=1 -e SEED_RATIONALE=1 api python -m entropia.apps.seed

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: frontend/e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: frontend/e2e
        timeout-minutes: 12
        run: ../../scripts/ci-install-playwright-chromium.sh

      - name: Run the E2E suite
        working-directory: frontend/e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_EMAIL: e2e_admin@e2e.entropia.test
        run: npm test

      - name: Run the visual-regression gate
        working-directory: frontend/e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_EMAIL: e2e_admin@e2e.entropia.test
        run: npm run visual

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs --tail 500

      - name: Upload Playwright report (screenshots, videos, traces)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  # The axe-core scan (specs/13-a11y-scan.spec.ts) was written as acceptance
  # evidence and never ran in CI, so an a11y regression could land unnoticed. It
  # gets its own runner (own Compose project + volumes) because it needs the same
  # seeded stack as the session job but takes its own ~15 min budget.
  #
  # The pass/fail boundary lives in the spec + frontend/e2e/a11y-baseline.json and
  # is NOT restated here: zero critical, and no serious rule above its frozen
  # per-page node-count ceiling. The earlier boundary allow-listed a whole rule id
  # (`color-contrast`) on every page, which recorded the deviation but stopped
  # measuring it — a brand-new low-contrast component would have landed green. A
  # ceiling is a node count per page per rule, so the known nodes stay recorded
  # and the next one fails.
  #
  # Raising a ceiling is a product-owner decision recorded in
  # docs/implementation/a11y_ci_ratchet_and_adjudication.md, never a CI
  # convenience. Lowering one after a real fix is expected: the run prints the
  # tightened map and uploads it as a11y-report/axe-baseline.tightened.json.
  a11y:
    name: A11Y — axe-core scan vs. the seeded stack (R2-14)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Build the .env for the Compose stack
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^ENTROPIA_BOOTSTRAP_ADMIN_EMAIL=.*/ENTROPIA_BOOTSTRAP_ADMIN_EMAIL=e2e_admin@e2e.entropia.test/' \
            -e "s#^ENTROPIA_SERVICE_TOKEN=.*#ENTROPIA_SERVICE_TOKEN=e2e-only-$(openssl rand -hex 24)#" \
            .env

      - name: Start the Docker Compose stack
        run: |
          # A registry/BuildKit transport blip — "target web: failed to solve:
          # Unavailable: error reading from server: EOF" while resolving a base
          # image — used to kill the whole job in ~30s, before a single test ran.
          # The pull+build is therefore retried a bounded number of times, with a
          # clean slate between attempts.
          #
          # This does NOT mask a real failure: a broken Dockerfile, a bad compose
          # file, or an image that genuinely cannot be built fails all three
          # attempts identically and the step still exits non-zero. Only the
          # transient transport class survives the retry.
          for attempt in 1 2 3; do
            if docker compose up -d --build; then
              exit 0
            fi
            echo "::warning::docker compose up failed (attempt ${attempt}/3); retrying"
            docker compose down --remove-orphans --volumes || true
            sleep $((attempt * 10))
          done
          echo "::error::docker compose up failed after 3 attempts"
          exit 1

      - name: Wait for the API and web app to become ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health/ready >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080 >/dev/null 2>&1; then
              echo "Stack is ready."
              exit 0
            fi
            echo "Waiting for stack... ($i/60)"
            sleep 5
          done
          echo "Stack did not become ready in time." >&2
          docker compose ps
          docker compose logs --tail 200
          exit 1

      - name: Seed the E2E golden fixture (R2-07) + live ESP registry (R2-12)
        # Same seed as the session job: the scan walks the 22-page matrix as
        # Admin, and empty pages would under-report violations.
        run: docker compose exec -T -e SEED_E2E_GOLDEN=1 -e SEED_ESP_TA=1 -e SEED_RATIONALE=1 api python -m entropia.apps.seed

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: frontend/e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: frontend/e2e
        timeout-minutes: 12
        run: ../../scripts/ci-install-playwright-chromium.sh

      - name: Run the axe-core a11y scan
        working-directory: frontend/e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_EMAIL: e2e_admin@e2e.entropia.test
        run: npm run a11y

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs --tail 500

      - name: Upload the axe report (per-page violations + summary)
        # Always uploaded: on a pass it is the acceptance-evidence artifact, on a
        # failure it names the offending nodes.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report
          path: |
            frontend/e2e/a11y-report/
            frontend/e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  # ===========================================================================
  # RC §6.7 / P11-8 — Lighthouse, wired as a RATCHET.
  #
  # Deliberately a sibling of `a11y` rather than a step inside it: both walk the
  # same route matrix as Admin, but Lighthouse drives its OWN browser (it needs
  # the DevTools port) and takes several passes per route, so folding it in
  # would turn one 40-minute job into one 80-minute job whose failure message no
  # longer says which gate went red.
  #
  # NOT on a schedule, on purpose. This is a per-PR gate like `a11y`, so the
  # `cancel-in-progress: github.ref != 'refs/heads/main'` at the top of this
  # workflow is right for it: superseding a PR run is what you want, and a push
  # to main is never cancelled. The nightly-cancellation hazard belongs to
  # performance.yml's `load-full` (the P10-7 baseline collector), which fires on
  # a `schedule` event — there `github.ref` IS `refs/heads/main`, so
  # cancel-in-progress evaluates false and no night can be cancelled by the next
  # one. Verified from the run log rather than assumed: six consecutive
  # scheduled runs, 2026-08-07..08-12, each completed with a `loadgen-baseline`
  # artifact (docs/releases/evidence/2026-08-12/p10_7_nightly_baselines.md).
  # ===========================================================================
  lighthouse:
    name: Lighthouse — score ratchet vs. the seeded stack (RC P11-8)
    runs-on: ubuntu-latest
    # Longer than `a11y` because the run is route-count x LH_REPEATS, and a
    # Lighthouse pass cannot end on network-quiet against a page holding an SSE
    # stream — it runs to the spec's own maxWaitForLoad cut instead.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Build the .env for the Compose stack
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^ENTROPIA_BOOTSTRAP_ADMIN_EMAIL=.*/ENTROPIA_BOOTSTRAP_ADMIN_EMAIL=e2e_admin@e2e.entropia.test/' \
            -e "s#^ENTROPIA_SERVICE_TOKEN=.*#ENTROPIA_SERVICE_TOKEN=e2e-only-$(openssl rand -hex 24)#" \
            .env

      - name: Start the Docker Compose stack
        # Same bounded retry as the sibling jobs: a registry/BuildKit transport
        # blip kills the job in ~30s before anything runs, while a genuinely
        # broken build fails all three attempts identically.
        run: |
          for attempt in 1 2 3; do
            if docker compose up -d --build; then
              exit 0
            fi
            echo "::warning::docker compose up failed (attempt ${attempt}/3); retrying"
            docker compose down --remove-orphans --volumes || true
            sleep $((attempt * 10))
          done
          echo "::error::docker compose up failed after 3 attempts"
          exit 1

      - name: Wait for the API and web app to become ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health/ready >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080 >/dev/null 2>&1; then
              echo "Stack is ready."
              exit 0
            fi
            echo "Waiting for stack... ($i/60)"
            sleep 5
          done
          echo "Stack did not become ready in time." >&2
          docker compose ps
          docker compose logs --tail 200
          exit 1

      - name: Seed the E2E golden fixture (R2-07) + live ESP registry (R2-12)
        # The same seed as the a11y job, for the same reason: the matrix is
        # walked as Admin, and an empty Library or Results page would be scored
        # for a render no user ever gets.
        run: docker compose exec -T -e SEED_E2E_GOLDEN=1 -e SEED_ESP_TA=1 -e SEED_RATIONALE=1 api python -m entropia.apps.seed

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: frontend/e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: frontend/e2e
        timeout-minutes: 12
        run: ../../scripts/ci-install-playwright-chromium.sh

      - name: Run the Lighthouse ratchet
        working-directory: frontend/e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_EMAIL: e2e_admin@e2e.entropia.test
        run: npm run lighthouse

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs --tail 500

      - name: Upload the Lighthouse report (scores, spread, re-baseline input)
        # Always uploaded: on a pass it is the evidence artifact, on a failure it
        # names the route and category that dropped, and in the unarmed
        # bootstrap state it carries the measured floors to freeze.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: |
            frontend/e2e/lighthouse-report/
            frontend/e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  # ===========================================================================
  # RC §6.2 / blocker 2 — the FIVE acceptance flows, wired as a BLOCKING gate.
  #
  # Until ADIM 45 `scripts/e2e-acceptance.sh flows` was a local command only. The
  # RC report's own words: "`flows` bir CI KAPISI DEĞİLDİR — yerel bir komuttur,
  # hiçbir workflow onu koşmaz, dolayısıyla bir regresyon sessizce geri
  # gelebilir." Coverage without a gate is a measurement somebody took once.
  #
  # WHY A JOB IN THIS WORKFLOW, NOT A NEW WORKFLOW. Two reasons, the second
  # load-bearing:
  #   * it is the same shape as its siblings — boot a Compose stack, seed the
  #     same three fixtures, drive it — so it belongs beside them;
  #   * CONCURRENCY. A new workflow needs its own `concurrency:` block, and
  #     getting that wrong is not hypothetical here: `e8d1d48` (#633) and
  #     `bc59dae` (#634) were both cancelled on main with ZERO jobs run, so
  #     their CI never executed at all while the badge looked settled. This
  #     workflow's block (top of file) is already `group: e2e-${{ github.ref }}`
  #     with `cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}` — on
  #     main that evaluates FALSE, so a push can never cancel its predecessor.
  #     Inheriting a block that is already right beats authoring a second one
  #     that has to be kept right. Verified from the job LOG, not the badge:
  #     docs/releases/evidence/2026-08-12/.
  #
  # BLOCKING, NOT ADVISORY: no `continue-on-error`, no `|| true` around the
  # harness. It exits 1 on any FAIL and 2 when Docker is missing or hung, and
  # both fail this job.
  # OUT OF SCOPE (P11-1), and stated so it is not mistaken for done: a
  # required-status-check rule in branch protection is what makes a red check
  # actually STOP a merge. That is a repository setting and a human decision.
  # Until it is set, this gate reports honestly but does not hold the button.
  #
  # COST, to be measured rather than guessed: a SECOND full stack (12
  # containers) on its own runner. As a sibling job it runs in PARALLEL with
  # e2e/a11y/lighthouse/e2e-dev, so it adds ~0 to the workflow's wall-clock and
  # only to the minutes bill. The measured runtime is recorded in
  # docs/releases/evidence/2026-08-12/.
  acceptance-flows:
    name: Acceptance flows (a)-(e) — five flows vs. an isolated stack (RC §6.2)
    runs-on: ubuntu-latest
    # The harness builds its own stack, waits for health (up to 360s), seeds,
    # drives five server-layer flows, waits up to 90s for the Coordinator to
    # consume a directive, then runs four browser journeys.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # NOTE: no `cp .env.example .env` here, unlike every sibling job. The
      # harness owns its stack — it writes its OWN hermetic `.env.e2e.flows` and
      # passes it via ENTROPIA_ENV_FILE. Writing a `.env` here would be a second
      # source of truth for a stack that already has one.

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json

      # Pre-install the browser WITH system deps. The harness's own
      # `npx playwright install chromium` (acceptance-flows.sh::af_browser_layer)
      # cannot pass `--with-deps`, which needs root — so on a bare runner the
      # download would succeed and chromium would then fail to LAUNCH on missing
      # shared libraries. The harness would record that as a SKIP, which is not a
      # false green, but it would quietly buy four fewer journeys than this job
      # claims to run. E2E_MAX_SKIPS below now turns exactly that into a failure;
      # installing here (where sudo exists) makes the harness's own install a
      # no-op and keeps the browser layer real.
      - name: Install E2E dependencies + Chromium with system deps
        working-directory: frontend/e2e
        timeout-minutes: 12
        run: |
          npm ci
          ../../scripts/ci-install-playwright-chromium.sh

      - name: Run the five acceptance flows
        env:
          # The ADJUDICATED skip count (RC §6.2). Exactly ONE skip is expected:
          # [c5]'s positive ESP activate->deprecate, structurally unreachable on
          # a SEED_ESP_TA stack because no canonical key is both validatable and
          # activatable. The other skip this gate inherited ([d3]'s tool-call
          # log) was CLOSED in ADIM 45 — the log is now exercised against the
          # real task the Coordinator spawns from a directive. Raising this
          # number is a §6.2 decision, never a CI convenience.
          E2E_MAX_SKIPS: "1"
        # `set -o pipefail` is load-bearing: the harness is piped through `tee`,
        # so without it the step would take TEE's exit status and a failing
        # acceptance run would report green. That is the precise shape of the
        # bug this gate exists to catch, so it must not be reintroduced by the
        # gate's own plumbing.
        run: |
          set -o pipefail
          start=$(date +%s)
          rc=0
          # `|| rc=$?` rather than a bare call: the default runner shell is
          # `bash -e`, which would abort the step the instant the harness exits
          # non-zero — losing the duration line this gate has to report, on
          # exactly the runs where the number matters most. Inside a `||` list
          # `-e` does not fire, pipefail still hands us the HARNESS's status
          # (not tee's), and the explicit `exit $rc` below still fails the job.
          bash scripts/e2e-acceptance.sh flows 2>&1 | tee acceptance-flows.log || rc=$?
          echo "duration_seconds=$(( $(date +%s) - start ))" | tee -a acceptance-flows.log
          exit $rc

      - name: Dump Compose logs on failure
        if: failure()
        # The project name is fixed by the harness's isolation contract
        # (`entropia-e2e-<flow>`). Its EXIT trap normally tears the stack down
        # before this runs, so this is best-effort and must never turn a real
        # failure into a confusing second one.
        run: docker compose -p entropia-e2e-flows logs --tail 500 || true

      - name: Upload the acceptance-flows log (PASS/FAIL/SKIP lines + duration)
        # Always: on a pass this is the §6.2 evidence artifact; on a failure it
        # carries the FAIL lines and the response bodies behind them.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-flows-log
          path: acceptance-flows.log
          retention-days: 14
          if-no-files-found: warn

  # audit TEST-09 / §9.6 — a SEPARATE, explicit dev-auth stack (its own runner, so
  # its own Compose project + volumes, never the session job's). The session job
  # above proves the normal session profile; this one proves the dev profile
  # satisfies ITS OWN contract (X-Actor-Id identity, no login, no Bearer), rather
  # than relying on an adaptive helper that merely works around whichever mode.
  e2e-dev:
    name: E2E — dev-auth acceptance (X-Actor-Id, no login)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the .env for the dev-auth Compose stack
        run: |
          cp .env.example .env
          # Dev impersonation is an EXPLICIT opt-in profile (not a corrected default):
          # this job deliberately selects it to exercise the dev contract. ENTROPIA_ENV
          # stays local — the backend refuses to boot dev anywhere else (F-22).
          sed -i -e 's/^AUTH_MODE=.*/AUTH_MODE=dev/' .env

      - name: Start the Docker Compose stack
        run: |
          # A registry/BuildKit transport blip — "target web: failed to solve:
          # Unavailable: error reading from server: EOF" while resolving a base
          # image — used to kill the whole job in ~30s, before a single test ran.
          # The pull+build is therefore retried a bounded number of times, with a
          # clean slate between attempts.
          #
          # This does NOT mask a real failure: a broken Dockerfile, a bad compose
          # file, or an image that genuinely cannot be built fails all three
          # attempts identically and the step still exits non-zero. Only the
          # transient transport class survives the retry.
          for attempt in 1 2 3; do
            if docker compose up -d --build; then
              exit 0
            fi
            echo "::warning::docker compose up failed (attempt ${attempt}/3); retrying"
            docker compose down --remove-orphans --volumes || true
            sleep $((attempt * 10))
          done
          echo "::error::docker compose up failed after 3 attempts"
          exit 1

      - name: Wait for the API and web app to become ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health/ready >/dev/null 2>&1 \
              && curl -fsS http://localhost:8080 >/dev/null 2>&1; then
              echo "Stack is ready."
              exit 0
            fi
            echo "Waiting for stack... ($i/60)"
            sleep 5
          done
          echo "Stack did not become ready in time." >&2
          docker compose ps
          docker compose logs --tail 200
          exit 1

      - name: Seed the dev identities (credentialless user_admin via X-Actor-Id)
        # In dev mode SEED_DEV_ADMIN defaults on, so this provisions the
        # credentialless `user_admin` principal the dev spec acts as.
        run: docker compose exec -T api python -m entropia.apps.seed

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: frontend/e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: frontend/e2e
        timeout-minutes: 12
        run: ../../scripts/ci-install-playwright-chromium.sh

      - name: Run the dev-auth acceptance spec
        working-directory: frontend/e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        # Only the dev-mode spec — the session journeys (real login) cannot run in
        # dev mode by design, and the dev spec self-skips outside a dev stack.
        run: npm test -- specs/16-dev-mode-auth.spec.ts

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs --tail 500

      - name: Upload Playwright report (screenshots, videos, traces)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-dev
          path: |
            frontend/e2e/playwright-report/
            frontend/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
