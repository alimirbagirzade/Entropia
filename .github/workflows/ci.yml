name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PRs/feature branches to save minutes, but never on
  # main: every push to main must run to completion so each merged commit lands
  # with a full, green CI check instead of a cancelled (incomplete) one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only token. Without an explicit block a workflow inherits the repository's
# DEFAULT token permissions, which on an older repo is read/write on `contents` —
# so every step here, including the dependency audits that resolve and execute
# third-party package code, would run holding a token that can push to the repo.
# None of these jobs writes anything back; they lint, type-check, test and build.
permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, type, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: entropia
          POSTGRES_PASSWORD: entropia
          POSTGRES_DB: entropia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entropia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://entropia:entropia@localhost:5432/entropia
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # SHA-pinned, unlike the `actions/*` steps around it: `astral-sh` is a
        # third party, and `@v7` is a MUTABLE tag its owner can repoint at any
        # commit. A compromised or repointed tag would execute in a job that has
        # already checked out the repository. `actions/*` stay on tags — they are
        # GitHub-owned and move with the runner images. Bump via dependabot's
        # github-actions ecosystem, which rewrites the SHA and the comment.
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras
      - name: Ruff (lint + format check)
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        working-directory: backend
        run: uv run mypy src
      - name: Acceptance traceability gate (semantic map)
        working-directory: backend
        # docs/audit/acceptance_semantic_map.yaml claims, clause by clause, which
        # test node proves each acceptance criterion in docs/spec/01..22. This step
        # fails when a cited node has been renamed or deleted, when a criterion
        # claims coverage it cannot cite, or when a server-truth axis (auth, OCC,
        # idempotency, agent parity) rests on a jsdom render. Static and DB-free —
        # it resolves nodes with `ast` and title extraction, never by running them,
        # so it is cheap and its verdict cannot drift with the environment.
        run: uv run python ../docs/audit/acceptance_semantic_scan.py --root .. --report

      - name: OpenAPI schema drift guard
        working-directory: backend
        # Regenerate the schema from the app and fail if docs/openapi.json is
        # stale (DB-free). Validity of the document is asserted by the contract
        # test suite. To fix a failure: `make openapi` and commit the snapshot.
        run: uv run python -m entropia.apps.api.openapi_export --check

      - name: Documentation truth gate (generated repository facts)
        working-directory: backend
        # Nothing in CI read `docs/` before this step, and the cost was measured,
        # not hypothetical: stale-base docs PRs deleted history records three
        # times (#590, #604), CLAUDE.md advertised "4 deliberate xfail" for weeks
        # after the real number became 1, and the same table total shipped as 102
        # in DATA_MODEL.md and 104 in CODEMAPS/README.md — both hand-counted.
        #
        # This step regenerates the facts in memory and fails when
        # docs/generated/repository_facts.{json,md} or README.md's generated block
        # is stale, when a kickoff/audit/history document carries no `doc-status`
        # marker (so a landed handoff still reads as the live one), or when a
        # present-tense document names an alembic head, ENGINE_VERSION or
        # SHARED_ALLOCATION_STATUS that the tree contradicts.
        #
        # Deliberately ordered AFTER the OpenAPI drift guard: the route facts are
        # read from docs/openapi.json, so when the snapshot itself is stale that
        # step names the cause and this one does not have to guess. Static and
        # DB-free like its two neighbours, and it reads no GitHub API — open PR
        # and issue counts are properties of a server, not of this tree, and a
        # gate depending on them could go red with no commit able to fix it.
        # To fix a failure: run the same script without --check and commit.
        run: uv run python ../scripts/generate_repository_facts.py --root .. --check

      - name: Alembic migrations apply cleanly
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Pytest (unit + contract + integration) + coverage gate
        working-directory: backend
        # pyproject's addopts carry --cov-fail-under=90, so a coverage drop fails
        # here rather than being printed and ignored. The floor is calibrated
        # against a measured 92.06% — docs/audit/coverage_baseline.md.
        run: uv run pytest

      - name: Dependency audit (pip-audit)
        working-directory: backend
        # `uv pip audit` does not exist (uv 0.11 has no audit subcommand), so run
        # the real tool against the synced project environment. Blocking from the
        # start: the backend dependency set is clean today, so any new advisory is
        # a genuine regression with nothing to grandfather in.
        run: uv run --with pip-audit pip-audit

  frontend:
    name: Frontend — lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test + coverage gate
        working-directory: frontend
        # `npm run coverage` is `vitest run --coverage` — the same suite `npm test`
        # runs, plus the thresholds in vite.config.ts. Running it here instead of
        # `npm test` keeps CI to a single pass over the suite. The timeouts v8
        # instrumentation needs (`testTimeout` in vite.config.ts,
        # `asyncUtilTimeout` in src/test/setup.ts) are set in config, not as
        # flags here, so both modes time out identically.
        run: npm run coverage
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Dependency audit (npm, high + critical)
        # Not a bare `npm audit --audit-level=high`: the frontend carries three
        # high advisories whose only published fix is a MAJOR upgrade (eslint 10,
        # or the react-router v8 migration that removes react-router-dom), and
        # .github/dependabot.yml deliberately suppresses frontend majors as
        # "cannot be merged piecemeal". A bare audit would therefore be red on
        # every PR, and `continue-on-error` would make it a step that can never
        # fail. The gate freezes those three advisory ids with a written reason and
        # fails on anything else — the same idiom as ACCEPTED_SERIOUS_RULES in the
        # a11y scan. Runs from the lockfiles, so no npm install is needed for e2e.
        run: node scripts/npm-audit-gate.mjs frontend frontend/e2e

  alerts:
    # RENAMED IN ADIM 31, because the old name was being misread. "Alert rules —
    # promtool" green was taken as "alerting works"; it never meant more than
    # "the rules are correct", and eleven correct rules reaching nobody is
    # exactly what docs/releases/Entropia_V18_RC_Readiness_2026-08-07.md §6.3
    # recorded as a release blocker. The job now covers the notification path's
    # configuration too — and still does NOT prove delivery, which is
    # scripts/alert-notification-proof.sh and is not a CI gate.
    name: Alert rules and notification path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate alert rules and scrape config
        # A separate job, not a step inside `backend`: this validates ops/ config
        # with a Prometheus binary and needs neither Postgres nor the Python
        # environment, so bolting a ~40-second check onto the ~42-minute backend
        # job would make it wait for one. In parallel it costs no extra wall
        # clock. Runs `promtool check config` + `check rules` + `test rules` from
        # a DIGEST-PINNED official Prometheus image — see the script header for
        # the supply-chain reasoning, which matches the gitleaks and trivy pins
        # in security.yml.
        run: scripts/alert-rules-gate.sh
      - name: Validate the notification routing config
        # Same job, because it is the same shape of check against the same ops/
        # tree with a digest-pinned image — a second job would pay another
        # checkout for ~15 seconds of work. Runs `amtool check-config` plus
        # `amtool config routes test`, which resolves concrete label sets through
        # the routing tree: a matcher typo that sends every page down the ticket
        # branch is valid config and amtool has no opinion about it until asked.
        run: scripts/alert-notification-gate.sh

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t entropia-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t entropia-web:ci ./frontend
